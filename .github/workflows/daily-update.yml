name: Daily Macro Dashboard Update

on:
  schedule:
    # Scheduled slots are placed so the whole delay envelope lands after the US
    # close and before the mirroring routines — that placement is the point.
    #
    # Two constraints bracket the window. GitHub fires these late: measured
    # drift was +4h32m/+4h54m/+5h13m on 09-09 and +4h33m on 09-10, against
    # 3-9 minutes back on 08-29..09-04, so the real run time is "scheduled +0..5h"
    # and every anchor must be judged as a five-hour span, not a point.
    # And the span has to sit between two walls: after 05:00 KST, when the US
    # session closes and the searched quotes (usdkrw, dxy, vix, wti) become a
    # settled close rather than a mid-session snapshot; and inside the hours when
    # nothing else is drawing on the Claude subscription's rolling 5-hour session
    # window. Both recorded failures came from violating the second wall — the
    # old 09:20 KST anchor drifted into the working day and .diag/last-failure.txt
    # caught a 1-turn probe rejected with "You've hit your session limit".
    #
    # 20:20 UTC anchors the primary at 05:20 KST, so its span is 05:20-10:30 KST:
    # past the close, still quiet, and finished before the 11:00 KST mirror. The
    # backups trail it; the third is a last resort that may reach into the
    # afternoon, which is worth it only because the guard makes it a no-op once a
    # slot has succeeded.
    - cron: '20 20 * * *'  # 05:20 KST next day — primary, just after the US close
    - cron: '20 23 * * *'  # 08:20 KST next day — backup
    - cron: '20 2 * * *'   # 11:20 KST — last resort before the 17:00 KST mirror
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # Two Claude attempts capped at 15 minutes each (a normal collection takes
    # 6-8), plus setup. Generous on purpose: this ceiling exists to stop a hung
    # run from burning a whole hour, not to cut a working one short.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main
          fetch-depth: 1

      - name: Ensure we are on a real local branch (not detached HEAD)
        run: git checkout -B main origin/main

      # Decides whether this run has anything to do. The signal is .run-status,
      # written by the workflow itself (not by Claude) at the end of every run as
      # "<KST date> ok" or "<KST date> partial". Only "<today> ok" means the day is
      # genuinely finished; a partial run must stay retryable, which is why
      # data-log.json's meta.lastRun is NOT used for this decision — Claude can die
      # after writing that field, and trusting it would let a half-finished day
      # block its own backup run for the rest of the day.
      # Fails open: a missing or unreadable marker never equals "<today> ok", so the
      # run proceeds rather than silently skipping.
      # workflow_dispatch always proceeds — a manual click means "run it now".
      - name: Decide whether today's collection already completed
        id: guard
        run: |
          TODAY_KST=$(date -u -d '+9 hours' '+%Y-%m-%d')
          RUN_STATUS=$(cat .run-status 2>/dev/null || echo "")
          LAST_RUN=$(python3 -c "import json; print(json.load(open('data-log.json'))['meta'].get('lastRun',''))" 2>/dev/null || echo "")
          echo "today (KST)  = ${TODAY_KST}"
          echo ".run-status  = ${RUN_STATUS:-<none>}"
          echo "meta.lastRun = ${LAST_RUN:-<none>}   (참고용, 판단에는 쓰지 않음)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$RUN_STATUS" = "$TODAY_KST ok" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::오늘(${TODAY_KST}) 수집이 이미 정상 완료되어 이 실행은 건너뜁니다."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::오늘(${TODAY_KST}) 수집이 아직 정상 완료되지 않았습니다. 수집을 진행합니다."
          fi

      # Runs before Claude and without it. Thirteen of the nineteen indicators
      # come from FRED, which serves plain CSV with no API key, so collecting
      # them here takes them off the subscription quota entirely: on a day when
      # the session limit is exhausted and Claude cannot run at all, those
      # thirteen are still current instead of the whole board freezing on
      # yesterday's numbers. It also shrinks Claude's own job from seventeen web
      # searches to six, which makes exhausting the quota less likely to begin
      # with, and the values are exact rather than parsed out of search snippets.
      # continue-on-error: a FRED outage must not fail the run — prompt.txt
      # treats any key missing from fred-latest.json as "keep the previous value".
      - name: Collect FRED series (no Claude, no quota)
        id: fred
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        run: python3 .github/scripts/fetch-fred.py

      - name: Set up Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        if: steps.guard.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude to update dashboard data
        id: claude_run
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Two attempts. On 2026-09-08 this step died after 76 seconds against a
          # normal runtime of 6-8 minutes — the kind of failure (a transient API
          # error, a hiccup on the first call) that a second try recovers, while a
          # real fault such as an expired token or an exhausted quota fails twice
          # and is correctly recorded as partial. Retrying is safe because the work
          # is idempotent: prompt.txt re-reads index.html and replaces values in
          # place, so a second pass over a half-updated file converges to the same
          # result rather than compounding the first pass.
          # The model is pinned rather than left to the CLI default: this job's output
          # is investment data, and a default that shifts under us would change how the
          # numbers are read without any signal here. Sonnet 5 suits the work —
          # prompt.txt already fixes the search terms, sources, thresholds and output
          # format, so this is precise execution of a specified procedure, not
          # open-ended reasoning.
          for attempt in 1 2; do
            echo "::group::Claude 실행 시도 ${attempt}/2"
            # Bounded so one wedged attempt cannot eat the budget of the other.
            if timeout 15m claude -p "$(cat .github/workflows/prompt.txt)" \
                 --model claude-sonnet-5 \
                 --allowedTools "Bash,Read,Write,Edit,WebSearch,WebFetch" \
                 --max-turns 60 \
                 --output-format text; then
              echo "::endgroup::"
              echo "::notice::Claude 실행 성공 (시도 ${attempt}/2)"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Claude 실행 실패 (시도 ${attempt}/2)"
            if [ "$attempt" = 1 ]; then sleep 60; fi
          done
          echo "::error::Claude 실행이 2회 모두 실패했습니다. 이번 실행은 부분갱신으로 기록됩니다."
          exit 1

      # Only on a failed collection, and only to answer one question the run logs
      # would answer if they were reachable: did the CLI fail because the account
      # cannot talk to the API at all, or because the collection itself broke?
      # A one-turn probe separates the two, and the verdict is committed to the
      # repo because the log archive sits behind a host that some networks deny —
      # .diag/last-failure.txt is readable over raw.githubusercontent.com.
      - name: Diagnose a failed collection
        if: always() && steps.guard.outputs.skip != 'true' && steps.claude_run.outcome == 'failure'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          OUT=$(timeout 3m claude -p "Reply with exactly: PONG" --max-turns 1 --output-format text 2>&1)
          CODE=$?
          # Actions masks secrets in the run log but NOT in files the job writes,
          # so strip the token explicitly before this text is committed.
          OUT=$(printf '%s' "$OUT" | sed "s|${CLAUDE_CODE_OAUTH_TOKEN}|<redacted>|g")
          mkdir -p .diag
          {
            echo "실패 진단 · $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST"
            echo "run_id: ${{ github.run_id }}"
            echo "probe_exit_code: ${CODE}"
            if [ "$CODE" = "0" ]; then
              echo "판정: 인증·한도는 정상 (1턴 probe 성공). 수집 작업 자체에서 실패했다."
            else
              echo "판정: 1턴 probe도 실패. 토큰 만료 또는 사용량 한도 소진 가능성이 높다."
            fi
            echo "--- probe 출력 (마지막 40줄) ---"
            printf '%s\n' "$OUT" | tail -40
          } > .diag/last-failure.txt
          cat .diag/last-failure.txt

      # The guard's input for later runs today, written by the workflow rather than
      # by Claude so that a run which died partway is recorded as partial and stays
      # retryable by the backup schedule.
      - name: Record whether the collection completed
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          TODAY_KST=$(date -u -d '+9 hours' '+%Y-%m-%d')
          if [ "${{ steps.claude_run.outcome }}" = "success" ]; then S=ok; else S=partial; fi
          echo "${TODAY_KST} ${S}" > .run-status
          echo "::notice::수집 결과 기록: ${TODAY_KST} ${S}"

      # Runs even if the Claude step above failed partway through — whatever
      # index.html / data-log.json changes it DID manage to write to disk
      # before failing still get committed, so a partial run is never lost.
      - name: Commit and push if changed
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          set +e
          git config user.name "Joosung-1019"
          git config user.email "jugul1019@gmail.com"
          git fetch origin main
          git rebase origin/main || { git rebase --abort; echo "rebase failed, continuing on local base"; }
          git add index.html data-log.json .run-status
          # Present only when the diagnosis step above ran, so guard the add.
          [ -d .diag ] && git add .diag
          if git diff --cached --quiet; then
            echo "GIT RESULT: NOCHANGE"
          else
            KST_NOW=$(date -u -d '+9 hours' '+%Y-%m-%d %H:%M')
            # Marks the commit so a half-finished day is visible in git log, not just in the run logs.
            TAG=""
            [ "${{ steps.claude_run.outcome }}" = "success" ] || TAG=" [부분갱신]"
            git commit -m "자동 갱신(GitHub Actions): ${KST_NOW}${TAG}"
            git push origin HEAD:main
            echo "GIT RESULT: SUCCESS"
          fi

      - name: Fail the run if claude step failed (for visibility)
        if: steps.claude_run.outcome == 'failure'
        run: exit 1
