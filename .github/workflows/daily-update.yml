name: Daily Macro Dashboard Update

on:
  schedule:
    - cron: '0 0 * * *'   # 09:00 KST (UTC+9) daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-update.yml'
      - '.github/workflows/prompt.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude to update dashboard data
        id: claude_run
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat .github/workflows/prompt.txt)" \
            --allowedTools "Bash,Read,Write,Edit,WebSearch,WebFetch" \
            --max-turns 60 \
            --output-format text

      - name: Report claude step outcome
        if: always()
        run: echo "claude step outcome was ${{ steps.claude_run.outcome }}"

      # Runs even if the Claude step above failed/timed out partway through —
      # whatever index.html / data-log.json changes it DID manage to write to
      # disk before failing still get committed, so a partial run is never lost.
      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "Joosung-1019"
          git config user.email "jugul1019@gmail.com"
          git add index.html data-log.json
          if git diff --cached --quiet; then
            echo "GIT RESULT: NOCHANGE"
          else
            KST_NOW=$(date -u -d '+9 hours' '+%Y-%m-%d %H:%M')
            git commit -m "자동 갱신(GitHub Actions): ${KST_NOW}"
            git push
            echo "GIT RESULT: SUCCESS"
          fi

      - name: Fail the run if claude step failed (for visibility)
        if: steps.claude_run.outcome == 'failure'
        run: exit 1
