name: Daily Macro Dashboard Update

# cron 이 없는 이유:
# GitHub Actions 의 예약 실행은 2026-09-05 이후 2~7.5시간씩 밀렸다. 예약 슬롯을
# 3개까지 늘려도 실제 발화는 13:53~20:33 KST 로 흩어져서 "아침 9시 갱신"을
# 지킬 수 없었다. 그래서 시계 역할은 정시 발화(09:07~09:11 KST)가 확인된
# claude.ai 루틴이 맡는다.
#
# 루틴이 이 워크플로를 깨우는 방법은 .trigger 파일에 커밋을 하나 미는 것이다.
# API(workflow_dispatch)를 쓰지 않는 이유: 루틴 샌드박스의 GitHub 접근은
# Claude GitHub 앱을 통하는데 그 앱에는 Actions 실행 권한이 없어
# POST .../dispatches 가 403 "Resource not accessible by integration" 으로 막힌다.
# 반면 저장소를 push 권한으로 붙이면 git push 는 정상 동작한다.
#
# paths 로 .trigger 만 잡는 이유: 이 워크플로 자신이 index.html/data-log.json 을
# 커밋해서 되밀기 때문에, 경로 제한이 없으면 자기 커밋이 다시 자신을 깨워
# 무한 루프가 된다. .trigger 는 루틴만 건드리므로 루프가 생기지 않는다.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.trigger']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main
          fetch-depth: 1

      - name: Ensure we are on a real local branch (not detached HEAD)
        run: git checkout -B main origin/main

      # 19개 지표 중 13개는 FRED 가 원본이고 API 키 없이 CSV 로 받을 수 있다.
      # 여기서 받아두면 Claude 사용량을 전혀 쓰지 않고, 검색 스니펫을 파싱하는
      # 것보다 값도 정확하다. Claude 가 맡는 몫은 6개로 줄어든다.
      # continue-on-error: FRED 장애가 전체 실행을 실패시키면 안 된다.
      # prompt.txt 는 오늘 날짜가 안 들어온 지표를 "이전 값 유지"로 처리한다.
      - name: Collect FRED series (no Claude, no quota)
        continue-on-error: true
        run: |
          set -o pipefail
          python3 .github/scripts/fetch-fred.py 2>&1 | tee -a .diag-run.txt

      # 받아온 13개를 화면까지 반영한다. 이 단계가 있어야 Claude 가 실패한 날에도
      # 13개는 오늘 값으로 남는다.
      - name: Apply FRED series to the dashboard (no Claude, no quota)
        continue-on-error: true
        run: |
          set -o pipefail
          echo "=== update-dashboard ===" >> .diag-run.txt
          python3 .github/scripts/update-dashboard.py 2>&1 | tee -a .diag-run.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude for the remaining 6 indicators
        id: claude_run
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # 2회 시도. 일시적인 API 오류는 재시도로 살아나고, 토큰 만료나 사용량
          # 소진 같은 진짜 문제는 두 번 다 실패해 부분갱신으로 기록된다.
          # 재시도가 안전한 이유: prompt.txt 는 index.html 을 다시 읽어 값을
          # 제자리 치환하므로, 반쯤 갱신된 파일에 다시 돌려도 같은 결과로 수렴한다.
          for attempt in 1 2; do
            echo "::group::Claude 실행 시도 ${attempt}/2"
            if timeout 15m claude -p "$(cat .github/workflows/prompt.txt)" \
                 --model claude-sonnet-5 \
                 --allowedTools "Bash,Read,Write,Edit,WebSearch,WebFetch" \
                 --max-turns 60 \
                 --output-format text; then
              echo "::endgroup::"
              echo "::notice::Claude 실행 성공 (시도 ${attempt}/2)"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Claude 실행 실패 (시도 ${attempt}/2)"
            [ "$attempt" = 1 ] && sleep 60
          done
          echo "::error::Claude 실행이 2회 모두 실패했습니다. 부분갱신으로 기록됩니다."
          exit 1

      # Claude 단계가 실패해도 돈다 — 그때까지 디스크에 써진 변경(FRED 13개 포함)은
      # 그대로 올린다. 부분갱신은 커밋 메시지에 표시해 git log 에서 바로 보인다.
      - name: Commit and push if changed
        if: always()
        run: |
          set +e
          git config user.name "Joosung-1019"
          git config user.email "jugul1019@gmail.com"
          git fetch origin main
          git rebase origin/main || { git rebase --abort; echo "rebase 실패, 로컬 기준으로 진행"; }
          git add index.html data-log.json
          [ -f .diag-run.txt ] && git add -f .diag-run.txt
          if git diff --cached --quiet; then
            echo "GIT RESULT: NOCHANGE"
          else
            KST_NOW=$(date -u -d '+9 hours' '+%Y-%m-%d %H:%M')
            TAG=""
            [ "${{ steps.claude_run.outcome }}" = "success" ] || TAG=" [부분갱신]"
            git commit -m "자동 갱신(GitHub Actions): ${KST_NOW}${TAG}"
            git push origin HEAD:main
            echo "GIT RESULT: SUCCESS"
          fi

      - name: Fail the run if the Claude step failed (for visibility)
        if: steps.claude_run.outcome == 'failure'
        run: exit 1
