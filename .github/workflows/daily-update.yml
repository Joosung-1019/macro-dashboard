name: Daily Macro Dashboard Update

on:
  schedule:
    - cron: '0 0 * * *'   # 09:00 KST (UTC+9) daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-update.yml'
      - '.github/workflows/prompt.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main
          fetch-depth: 1

      - name: Ensure we are on a real local branch (not detached HEAD)
        run: |
          git checkout -B main origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude to update dashboard data
        id: claude_run
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          claude -p "$(cat .github/workflows/prompt.txt)" \
            --allowedTools "Bash,Read,Write,Edit,WebSearch,WebFetch" \
            --max-turns 60 \
            --output-format text > /tmp/claude_stdout.log 2>/tmp/claude_stderr.log
          echo "CLAUDE_EXIT_CODE=$?" >> claude-debug.log
          echo "--- STDOUT (last 200 lines) ---" >> claude-debug.log
          tail -n 200 /tmp/claude_stdout.log >> claude-debug.log
          echo "--- STDERR (last 100 lines) ---" >> claude-debug.log
          tail -n 100 /tmp/claude_stderr.log >> claude-debug.log
          exit_code=$(grep -o 'CLAUDE_EXIT_CODE=[0-9]*' claude-debug.log | head -1 | cut -d= -f2)
          if [ "$exit_code" != "0" ]; then exit 1; fi

      - name: Report claude step outcome
        if: always()
        run: echo "claude step outcome was ${{ steps.claude_run.outcome }}"

      - name: Commit and push if changed (always, including debug log)
        if: always()
        run: |
          set -x
          git config user.name "Joosung-1019"
          git config user.email "jugul1019@gmail.com"
          git fetch origin main
          git rebase origin/main || (git rebase --abort; echo "REBASE FAILED, continuing on local base"; true)
          git add index.html data-log.json
          [ -f claude-debug.log ] && git add -f claude-debug.log
          if git diff --cached --quiet; then
            echo "GIT RESULT: NOCHANGE"
          else
            KST_NOW=$(date -u -d '+9 hours' '+%Y-%m-%d %H:%M')
            git commit -m "자동 갱신(GitHub Actions): ${KST_NOW}"
            git push origin HEAD:main
            echo "GIT RESULT: SUCCESS"
          fi

      - name: Fail the run if claude step failed (for visibility)
        if: steps.claude_run.outcome == 'failure'
        run: exit 1
